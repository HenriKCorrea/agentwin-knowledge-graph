version: '3'

services:
  app:
    # image: mcr.microsoft.com/devcontainers/base:ubuntu
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Update this to wherever you want VS Code to mount the folder of your project
      - ../..:/workspaces:cached
    # Overrides default command so things don't shut down after the process ends.
    # entrypoint: /usr/local/share/docker-init.sh
    command: sleep infinity 

    # Uncomment the next four lines if you will use a ptrace-based debuggers like C++, Go, and Rust.
    # cap_add:
    #  - SYS_PTRACE
    # security_opt:
    #   - seccomp:unconfined

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)
  plantuml-server:
    image: docker.io/plantuml/plantuml-server:jetty
    volumes:
      # Jetty's default URI/header buffer is 8192 bytes, which is too small for large
      # PlantUML diagrams (encoded as a GET URL). The override.ini raises the limit to
      # 64 KB. JAVA_OPTIONS/-D flags do not work for Jetty module properties; the only
      # reliable way is dropping an ini file into start.d/. See jetty-override.ini.
      - ./jetty-override.ini:/var/lib/jetty/start.d/override.ini
    ports:
      - 8080:8080
