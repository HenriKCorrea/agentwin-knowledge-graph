# Raise Jetty's HTTP request header/URI buffer from the default 8192 bytes to 64 KB.
# PlantUML encodes diagrams as compressed, base64-encoded strings in the request URL.
# Large diagrams exceed the default limit, causing:
#   WARN: URI is too large >8192
# and a 400 error in the VS Code PlantUML extension.
# This file is mounted into /var/lib/jetty/start.d/ so Jetty picks it up at startup.
jetty.httpConfig.requestHeaderSize=65536
